rd" type="password" maxlength="128" autocomplete="off" placeholder="Confirm password" style="display:none" disabled aria-hidden="true"><label class="remember"><input id="remember" type="checkbox"><span>Keep me signed in</span></label><p class="session-note">Stay signed in for 90 days, including after updates and restarts.</p><p id="e" role="status" aria-live="polite" aria-atomic="true"></p><div class="actions"><button id="b" type="submit" disabled>Sign in</button><p class="note">Your stove, at a glance.</p></div></form></main><script>(()=>{if(location.pathname!=='/login'){location.replace('/login');return}const form=document.querySelector('form'),password=document.getElementById('p'),confirm=document.getElementById('c')||document.createElement('input'),intro=document.getElementById('intro'),label=document.getElementById('label'),button=document.getElementById('b'),feedback=document.getElementById('e'),remember=document.getElementById('remember');let first=false,ready=false,busy=false;const show=document.getElementById('show');show.onclick=()=>{const reveal=password.type==='password';password.type=reveal?'text':'password';show.setAttribute('aria-label',reveal?'Hide password':'Show password');show.setAttribute('aria-pressed',String(reveal))};async function request(url,options){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),20000);try{const response=await fetch(url,{...options,signal:controller.signal,cache:'no-store'});let data;try{data=await response.json()}catch{throw new Error('The monitor returned an unexpected response. Please try again.')}if(!response.ok)throw new Error(data.error||(response.status===403?'This address cannot be used to sign in. Open the HTTPS dashboard.':'Could not sign in. Please try again.'));return data}finally{clearTimeout(timer)}}request('/api/auth/status').then(status=>{first=!status.configured;document.getElementById('title').textContent=first?'Make yourself at home':'Welcome back';button.textContent=first?
