<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5ead8"><meta name="color-scheme" content="light">
<title>Flue Monitor</title>
<style>
html,body{background:#f5ead8;color:#201e1d;color-scheme:light}
#startup{position:fixed;inset:0;z-index:100;background:#f5ead8;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;text-align:center;font:17px/1.5 system-ui,sans-serif}
#startup,#startup *{box-sizing:border-box}
#startup[hidden]{display:none}
#startup h1{font:600 24px/1.2 system-ui,sans-serif;letter-spacing:normal;margin:24px 0 8px}
#startup p{max-width:300px;color:#645c50;margin:0 0 20px}
#startup a{color:#8c491a;text-underline-offset:4px;padding:12px}
.startup-spinner{width:24px;height:24px;border:3px solid #d9c9b0;border-top-color:#8c491a;border-radius:50%;animation:startup-spin 1s linear infinite}
@keyframes startup-spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.startup-spinner{animation:none}}
</style><style>#retry{border:0;border-radius:24px;padding:12px 24px;background:#bb773e;color:#fff5e6;font:inherit;cursor:pointer}#retry[hidden]{display:none}</style>
</head><body>
<section id="startup" aria-labelledby="startup-title"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="96" height="96" aria-hidden="true" xmlns:c2pa="http://c2pa.org/manifest"><defs>
<radialGradient id="fire" cx="0.5" cy="0.95" r="0.75" fx="0.5" fy="0.95"><stop offset="0" stop-color="#ffc6a5"></stop><stop offset="0.55" stop-color="#8c491a"></stop><stop offset="0.9" stop-color="#474238"></stop></radialGradient>
<clipPath id="win"><rect x="128" y="143" width="256" height="195" rx="50"></rect></clipPath>
<filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="22"></feGaussianBlur></filter>
</defs>
<rect width="96" height="96" aria-hidden="true" rx="115" fill="#f5ead8"></rect>
<rect x="210" y="0" width="92" height="102" fill="#2e2b25"></rect>
<rect x="82" y="92" width="348" height="317" rx="60" fill="#2e2b25"></rect>
<path fill="#2e2b25" d="M113 405h46v18a23 23 0 0 1-46 0z"></path><path fill="#2e2b25" d="M353 405h46v18a23 23 0 0 1-46 0z"></path>
<rect x="128" y="143" width="256" height="195" rx="50" fill="#8c491a" filter="url(#glow)" opacity="0.8"></rect>
<g clip-path="url(#win)">
<rect x="128" y="143" width="256" height="195" fill="url(#fire)"></rect>
<path fill="#c67139" d="M174 288.1A38.5 79.1 0 0 1 251 288.1A38.5 33.9 0 0 1 174 288.1Z"></path><path fill="#c67139" d="M246 278.8A46 100.8 0 0 1 338 278.8A46 43.199999999999996 0 0 1 246 278.8Z"></path><path fill="#ffe1d0" d="M261 293.2A28 60.199999999999996 0 0 1 317 293.2A28 25.8 0 0 1 261 293.2Z"></path><path fill="#ffe1d0" d="M195 301.3A20.5 41.3 0 0 1 236 301.3A20.5 17.7 0 0 1 195 301.3Z"></path>
</g>
</svg><h1 id="startup-title">Flue Monitor</h1>
<p id="startup-message" role="status">Connecting to your stove…</p>
<span id="spinner" class="startup-spinner" aria-hidden="true"></span>
<button id="retry" type="button" hidden>Try again</button></section>
<script>
// Fetch fresh HTML with the existing session cookie. This is a subresource
// request, so the worker never substitutes the connecting screen recursively.
// No private document or API response is written to Cache Storage.
let connecting = false;
async function connect() {
  if (connecting) return;
  connecting = true;
  const message = document.getElementById('startup-message');
  const retry = document.getElementById('retry');
  const spinner = document.getElementById('spinner');
  message.textContent = 'Connecting to your stove…';
  retry.hidden = true;
  spinner.hidden = false;
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 15000);
  try {
    const response = await fetch(location.href, {cache: 'no-store', credentials: 'same-origin', signal: controller.signal});
    if (!response.ok || !(response.headers.get('Content-Type') || '').includes('text/html'))
      throw new Error('Monitor unavailable');
    // The server redirects unauthenticated requests to the real login URL.
    // Navigate there instead of inserting password fields with document.write.
    if (new URL(response.url).pathname === '/login') {
      location.replace('/login');
      return;
    }
    const html = await response.text();
    clearTimeout(timer);
    // Replace the public shell with the live dashboard,
    // keeping this URL and origin so scripts, cookies and relative paths work.
    document.open();
    document.write(html);
    document.close();
  } catch (error) {
    message.textContent = navigator.onLine === false
      ? 'You’re offline. Reconnect to reach your stove.'
      : 'Could not reach your stove. Check your connection and try again.';
    spinner.hidden = true;
    retry.hidden = false;
  } finally {
    clearTimeout(timer);
    connecting = false;
  }
}
document.getElementById('retry').addEventListener('click', connect);
window.addEventListener('online', connect);
connect();
</script></body></html>
